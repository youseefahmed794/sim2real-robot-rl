[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2real-robot-rl"
version = "0.1.0"
authors = [
  { name="Youseef Abdel Tawwab", email="youseefahmed794@gmail.com" },
]
description = "Sim-to-Real Reinforcement Learning for Dynamic Quadruped Locomotion: PPO, Domain Randomization, and ROS 2 Deployment"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
rl = [
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "mujoco>=3.0.0",
]
